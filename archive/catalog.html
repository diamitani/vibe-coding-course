    <!-- Page Header -->

    <div class="container" style="max-width: 1200px; margin: 0 auto; padding: 2rem 1rem; display: grid; grid-template-columns: 250px 1fr; gap: 2rem;">
      <!-- Sidebar Filters -->
      <aside style="position: sticky; top: 100px; height: fit-content;">
        <div style="background: var(--bg-card); border-radius: var(--radius-lg); padding: 1.5rem; border: 1px solid var(--border-subtle);">

          <div style="margin-bottom: 1.5rem;">
            <label style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.5rem;">Category</label>
            <select id="category-filter" class="form-input" onchange="filterCourses()" style="width: 100%;">
              <option value="all">All Categories</option>
              <option value="vibe-coding">Vibe Coding</option>
              <option value="ai-tools">AI Tools</option>
              <option value="prompt-engineering">Prompt Engineering</option>
              <option value="web-development">Web Development</option>
              <option value="automation">Automation</option>
            </select>
          </div>

          <div style="margin-bottom: 1.5rem;">
            <label style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.5rem;">Level</label>
            <select id="level-filter" class="form-input" onchange="filterCourses()" style="width: 100%;">
              <option value="all">All Levels</option>
              <option value="beginner">Beginner</option>
              <option value="intermediate">Intermediate</option>
              <option value="advanced">Advanced</option>
            </select>
          </div>

          <div style="margin-bottom: 1.5rem;">
            <label style="display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.5rem;">Price</label>
            <select id="price-filter" class="form-input" onchange="filterCourses()" style="width: 100%;">
              <option value="all">All Prices</option>
              <option value="free">Free</option>
              <option value="paid">Paid</option>
            </select>
          </div>

          <button onclick="resetFilters()" class="btn btn-secondary" style="width: 100%; margin-top: 1rem;">Reset Filters</button>
        </div>
      </aside>

      <!-- Course Grid -->
      <div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
          <p id="results-count" style="color: var(--text-secondary);">Showing 12 courses</p>
          <select id="sort-filter" class="form-input" onchange="sortCourses()" style="width: auto;">
            <option value="popular">Most Popular</option>
            <option value="newest">Newest</option>
            <option value="rating">Highest Rated</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
          </select>
        </div>

        <div id="courses-grid" class="courses-grid" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem;">
          <!-- Courses loaded dynamically -->
        </div>
      </div>
    </div>
  </main>

    function renderCourses(courses) {
      const grid = document.getElementById('courses-grid');
      const countEl = document.getElementById('results-count');
      countEl.textContent = `Showing ${courses.length} courses`;
      
      grid.innerHTML = courses.map(course => `
        <a href="catalog.html?course=${course.id}" class="course-card" style="text-decoration: none;">
          <div style="background: var(--bg-card); border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border-subtle); transition: transform 0.3s ease, box-shadow 0.3s ease;" onmouseover="this.style.transform='translateY(-4px)'; this.style.boxShadow='0 10px 30px rgba(0,0,0,0.3)';" onmouseout="this.style.transform=''; this.style.boxShadow='';">
            <div style="height: 140px; background: ${course.gradient}; display: flex; align-items: center; justify-content: center; position: relative;">
              <span style="font-size: 3rem;">${getEmoji(course.category)}</span>
              ${course.tag ? `<span style="position: absolute; top: 1rem; right: 1rem; background: rgba(255,255,255,0.2); padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.7rem;">${course.tag}</span>` : ''}
            </div>
            <div style="padding: 1rem;">
              <h3 style="font-size: 0.95rem; font-weight: 600; color: var(--text-primary); margin-bottom: 0.25rem;">${course.title}</h3>
              <p style="font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 0.5rem;">${course.instructor}</p>
              <div style="display: flex; align-items: center; gap: 0.25rem; margin-bottom: 0.5rem;">
                <span style="color: #fbbf24; font-size: 0.75rem;">★★★★★</span>
                <span style="color: var(--text-muted); font-size: 0.75rem;">${course.rating} (${course.reviews})</span>
              </div>
              <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem;">
                <span style="font-weight: 600; color: var(--accent-emerald);">${course.price === 0 ? 'Free' : '$' + course.price}</span>
                <span style="color: var(--text-muted);">${course.duration}</span>
              </div>
            </div>
          </div>
        </a>
      `).join('');
    }

    function getEmoji(category) {
      const emojis = {
        'vibe-coding': '🤖',
        'ai-tools': '🛠️',
        'prompt-engineering': '💬',
        'web-development': '💻',
        'automation': '⚡'
      };
      return emojis[category] || '📚';
    }

    function filterCourses() {
      const category = document.getElementById('category-filter').value;
      const level = document.getElementById('level-filter').value;
      const price = document.getElementById('price-filter').value;
      
      let filtered = coursesData.filter(course => {
        if (category !== 'all' && course.category !== category) return false;
        if (level !== 'all' && course.level !== level) return false;
        if (price === 'free' && course.price !== 0) return false;
        if (price === 'paid' && course.price === 0) return false;
        return true;
      });
      
      sortCourses(filtered);
    }

    function sortCourses(courses = null) {
      if (!courses) {
        const category = document.getElementById('category-filter').value;
        const level = document.getElementById('level-filter').value;
        const price = document.getElementById('price-filter').value;
        
        courses = coursesData.filter(course => {
          if (category !== 'all' && course.category !== category) return false;
          if (level !== 'all' && course.level !== level) return false;
          if (price === 'free' && course.price !== 0) return false;
          if (price === 'paid' && course.price === 0) return false;
          return true;
        });
      }
      
      const sortValue = document.getElementById('sort-filter').value;
      
      switch (sortValue) {
        case 'popular':
          courses.sort((a, b) => b.students - a.students);
          break;
        case 'newest':
          courses.sort((a, b) => b.id - a.id);
          break;
        case 'rating':
          courses.sort((a, b) => b.rating - a.rating);
          break;
        case 'price-low':
          courses.sort((a, b) => a.price - b.price);
          break;
        case 'price-high':
          courses.sort((a, b) => b.price - a.price);
          break;
      }
      
      renderCourses(courses);
    }

    function resetFilters() {
      document.getElementById('category-filter').value = 'all';
      document.getElementById('level-filter').value = 'all';
      document.getElementById('price-filter').value = 'all';
      document.getElementById('sort-filter').value = 'popular';
      renderCourses(coursesData);
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const categoryParam = urlParams.get('category');
      
      if (categoryParam) {
        document.getElementById('category-filter').value = categoryParam;
      }
      
      filterCourses();
    });
  </script>
