        function filterTools(cat) {
            const q = document.getElementById('tool-search').value.toLowerCase();
            document.querySelectorAll('.showcase-filters .filter-btn').forEach(b => {
                b.classList.toggle('active', (cat || 'all') === (b.textContent.trim() === 'All' ? 'all' : b.textContent.trim()));
            });

            // Combine built-in and custom GPTs
            const allTools = [...BUILTIN_TOOLS, ...CUSTOM_GPTS.map(g => ({ ...g, icon: '🤖' }))];

            const filtered = allTools.filter(t => {
                const matchCat = !cat || cat === 'all' || t.category === cat;
                const matchQ = !q || t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q) || t.category.toLowerCase().includes(q);
                return matchCat && matchQ;
            });
            const grid = document.getElementById('tools-grid');
            grid.innerHTML = filtered.map(t => `
        <a href="${t.url}" target="_blank" rel="noopener" class="tool-link-card fade-in visible">
          <div class="tool-icon">${t.icon || '🤖'}</div>
          <div class="tool-category">${t.category}</div>
          <div class="tool-name">${t.name}</div>
          <div class="tool-url">${t.url.replace('https://', '')}</div>
          <div class="tool-desc">${t.desc}</div>
          <div class="tool-footer">
            <div class="tool-tags">${t.tags.map((tg, i) => `<span class="tag ${['', 'cyan', 'emerald'][i % 3]}">${tg}</span>`).join('')}</div>
            <span class="visit-link">Visit →</span>
          </div>
        </a>`).join('');
        }
        filterTools('all');
