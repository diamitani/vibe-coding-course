<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe Coding Tutorials | LetsVibeAI</title>
    <meta name="description" content="Curated video tutorials for vibe coding with Cursor, Claude, and other AI tools. Learn from Nate Herk, Nick Saraev, Liam Ottley, and more.">
    <link rel="stylesheet" href="styles.css">
    <style>
        .tutorials-hero {
            text-align: center;
            padding: var(--space-3xl) 0 var(--space-xl);
        }
        
        .tutorials-hero h1 {
            font-size: clamp(2.5rem, 6vw, 4rem);
            margin-bottom: var(--space-md);
        }
        
        .category-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            justify-content: center;
            margin: var(--space-xl) 0;
            padding: 0 var(--space-md);
        }
        
        .category-tab {
            padding: 0.75rem 1.5rem;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 50px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9375rem;
        }
        
        .category-tab:hover {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }
        
        .category-tab.active {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            color: var(--bg-primary);
        }
        
        .category-section {
            margin-bottom: var(--space-3xl);
        }
        
        .category-header {
            margin-bottom: var(--space-lg);
        }
        
        .category-header h2 {
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
        }
        
        .category-header p {
            color: var(--text-muted);
        }
        
        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: var(--space-lg);
        }
        
        .video-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.2s;
            cursor: pointer;
        }
        
        .video-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-primary);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .video-thumbnail {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            background: var(--bg-secondary);
            overflow: hidden;
        }
        
        .video-thumbnail iframe,
        .video-thumbnail img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .video-thumbnail .play-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .video-card:hover .play-overlay {
            background: var(--accent-primary);
            transform: translate(-50%, -50%) scale(1.1);
        }
        
        .play-overlay svg {
            width: 24px;
            height: 24px;
            fill: white;
            margin-left: 4px;
        }
        
        .video-duration {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8125rem;
            font-weight: 500;
        }
        
        .video-info {
            padding: var(--space-md);
        }
        
        .video-creator {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--accent-primary);
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        
        .video-title {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }
        
        .video-description {
            color: var(--text-muted);
            font-size: 0.9375rem;
            line-height: 1.5;
            margin-bottom: var(--space-sm);
        }
        
        .video-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        
        .video-tag {
            background: var(--bg-secondary);
            color: var(--text-muted);
            padding: 0.25rem 0.75rem;
            border-radius: 50px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .creators-section {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: var(--space-xl);
            margin-top: var(--space-3xl);
        }
        
        .creators-section h2 {
            text-align: center;
            margin-bottom: var(--space-lg);
        }
        
        .creators-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: var(--space-md);
        }
        
        .creator-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: var(--space-md);
            transition: all 0.2s;
        }
        
        .creator-card:hover {
            background: var(--bg-hover);
        }
        
        .creator-card h3 {
            font-size: 1.125rem;
            margin-bottom: 0.25rem;
        }
        
        .creator-card p {
            color: var(--text-muted);
            font-size: 0.9375rem;
            margin-bottom: 0.5rem;
        }
        
        .creator-card .video-count {
            color: var(--accent-primary);
            font-size: 0.875rem;
            font-weight: 500;
        }
        
        .video-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: var(--space-lg);
        }
        
        .video-modal.active {
            display: flex;
        }
        
        .video-modal-content {
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16/9;
            background: black;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }
        
        .video-modal-content iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .video-modal-close {
            position: absolute;
            top: -40px;
            right: 0;
            background: none;
            border: none;
            color: white;
            font-size: 2rem;
            cursor: pointer;
        }
        
        @media (max-width: 768px) {
            .videos-grid {
                grid-template-columns: 1fr;
            }
            
            .category-tabs {
                overflow-x: auto;
                flex-wrap: nowrap;
                justify-content: flex-start;
                padding-bottom: var(--space-sm);
            }
            
            .category-tab {
                white-space: nowrap;
            }
        }
    </style>
</head>

<body>
    <div class="ambient-bg"></div>
    <nav class="nav">
        <div class="nav-inner">
            <a href="index.html" class="nav-logo">⚡ LetsVibeAI</a>
            <button class="nav-toggle" aria-label="Toggle navigation">☰</button>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="module1.html">Modules</a></li>
                <li><a href="tools.html">Tools</a></li>
                <li><a href="tutorials.html" class="active">Tutorials</a></li>
                <li><a href="news.html">News</a></li>
                <li id="auth-nav-slot"></li>
            </ul>
        </div>
    </nav>

    <main class="page-content">
        <div class="container">
            <section class="tutorials-hero">
                <span class="hero-badge"><span class="dot"></span> Video Library</span>
                <h1>Vibe Coding <span class="gradient-text">Tutorials</span></h1>
                <p>Learn from the best creators in the AI coding space. Curated tutorials from Nate Herk, Nick Saraev, Liam Ottley, and more.</p>
            </section>

            <!-- Category Tabs -->
            <div class="category-tabs" id="category-tabs">
                <button class="category-tab active" data-category="all">All Tutorials</button>
                <!-- Categories loaded dynamically -->
            </div>

            <!-- Tutorials Container -->
            <div id="tutorials-container">
                <div class="news-loading">
                    <div class="spinner"></div>
                    <p>Loading tutorials...</p>
                </div>
            </div>

            <!-- Featured Creators -->
            <section class="creators-section">
                <h2>Featured Creators</h2>
                <div class="creators-grid" id="creators-grid">
                    <!-- Creators loaded dynamically -->
                </div>
            </section>
        </div>
    </main>

    <!-- Video Modal -->
    <div class="video-modal" id="video-modal">
        <div class="video-modal-content">
            <button class="video-modal-close" onclick="closeVideoModal()">&times;</button>
            <iframe id="video-iframe" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>⚡ LetsVibeAI &copy; 2025</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="supabase-client.js"></script>
    <script src="script.js"></script>
    <script>
        let tutorialsData = null;
        let currentCategory = 'all';

        async function loadTutorials() {
            try {
                const response = await fetch('tutorials.json');
                tutorialsData = await response.json();
                renderCategoryTabs();
                renderTutorials();
                renderCreators();
            } catch (error) {
                console.error('Failed to load tutorials:', error);
                document.getElementById('tutorials-container').innerHTML = `
                    <div style="text-align: center; padding: var(--space-xl);">
                        <p style="font-size: 2rem; margin-bottom: 1rem;">📚</p>
                        <p>Failed to load tutorials. Please try again later.</p>
                    </div>
                `;
            }
        }

        function renderCategoryTabs() {
            const tabsContainer = document.getElementById('category-tabs');
            tutorialsData.categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'category-tab';
                btn.dataset.category = cat.id;
                btn.textContent = cat.name;
                btn.onclick = () => selectCategory(cat.id);
                tabsContainer.appendChild(btn);
            });
        }

        function selectCategory(categoryId) {
            currentCategory = categoryId;
            document.querySelectorAll('.category-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.category === categoryId);
            });
            renderTutorials();
        }

        function renderTutorials() {
            const container = document.getElementById('tutorials-container');
            
            if (currentCategory === 'all') {
                // Show all categories
                container.innerHTML = tutorialsData.categories.map(cat => `
                    <div class="category-section">
                        <div class="category-header">
                            <h2>${escapeHTML(cat.name)}</h2>
                            <p>${escapeHTML(cat.description)}</p>
                        </div>
                        <div class="videos-grid">
                            ${cat.videos.map(video => renderVideoCard(video)).join('')}
                        </div>
                    </div>
                `).join('');
            } else {
                // Show single category
                const category = tutorialsData.categories.find(c => c.id === currentCategory);
                if (category) {
                    container.innerHTML = `
                        <div class="category-section">
                            <div class="category-header">
                                <h2>${escapeHTML(category.name)}</h2>
                                <p>${escapeHTML(category.description)}</p>
                            </div>
                            <div class="videos-grid">
                                ${category.videos.map(video => renderVideoCard(video)).join('')}
                            </div>
                        </div>
                    `;
                }
            }
        }

        function renderVideoCard(video) {
            const thumbnailUrl = `https://img.youtube.com/vi/${video.youtubeId}/maxresdefault.jpg`;
            return `
                <div class="video-card" onclick="openVideo('${video.youtubeId}', '${escapeHTML(video.title)}')">
                    <div class="video-thumbnail">
                        <img src="${thumbnailUrl}" alt="${escapeHTML(video.title)}" onerror="this.src='https://img.youtube.com/vi/${video.youtubeId}/hqdefault.jpg'">
                        <div class="play-overlay">
                            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        </div>
                        <span class="video-duration">${video.duration}</span>
                    </div>
                    <div class="video-info">
                        <div class="video-creator">
                            <span>👤</span> ${escapeHTML(video.creator)}
                        </div>
                        <h3 class="video-title">${escapeHTML(video.title)}</h3>
                        <p class="video-description">${escapeHTML(video.description)}</p>
                        <div class="video-tags">
                            ${video.tags.map(tag => `<span class="video-tag">${escapeHTML(tag)}</span>`).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderCreators() {
            const container = document.getElementById('creators-grid');
            container.innerHTML = tutorialsData.creators.map(creator => `
                <a href="${creator.channel}" target="_blank" rel="noopener" class="creator-card" style="text-decoration: none; color: inherit;">
                    <h3>${escapeHTML(creator.name)}</h3>
                    <p>${escapeHTML(creator.description)}</p>
                    <div class="video-count">${creator.videoCount} videos in library</div>
                </a>
            `).join('');
        }

        function openVideo(youtubeId, title) {
            const modal = document.getElementById('video-modal');
            const iframe = document.getElementById('video-iframe');
            iframe.src = `https://www.youtube.com/embed/${youtubeId}?autoplay=1`;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeVideoModal() {
            const modal = document.getElementById('video-modal');
            const iframe = document.getElementById('video-iframe');
            iframe.src = '';
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        // Close modal on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeVideoModal();
        });

        // Close modal on background click
        document.getElementById('video-modal').addEventListener('click', (e) => {
            if (e.target.id === 'video-modal') closeVideoModal();
        });

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // Load tutorials on page load
        loadTutorials();
    </script>
</body>

</html>
