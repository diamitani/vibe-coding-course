<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | LetsVibeAI</title>
    <meta name="description" content="Sign in to LetsVibeAI to track your progress.">
    <link rel="stylesheet" href="styles.css">
    <style>
        .auth-tabs { display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 1px solid var(--border-subtle); }
        .auth-tab { padding: 1rem 2rem; background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 1rem; border-bottom: 2px solid transparent; }
        .auth-tab.active { color: var(--accent-primary); border-bottom-color: var(--accent-primary); }
        .form-error { color: #ef4444; background: rgba(239,68,68,0.1); padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; display: none; }
        .form-success { color: #10b981; background: rgba(16,185,129,0.1); padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; display: none; }
        .oauth-divider { display: flex; align-items: center; margin: 1.5rem 0; color: var(--text-muted); font-size: 0.875rem; }
        .oauth-divider::before, .oauth-divider::after { content: ''; flex: 1; height: 1px; background: var(--border-subtle); margin: 0 1rem; }
        .oauth-buttons { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1rem; }
        .oauth-btn { display: flex; align-items: center; justify-content: center; gap: 0.75rem; padding: 0.75rem 1rem; border-radius: 8px; border: 1px solid var(--border-subtle); background: var(--bg-card); color: var(--text-primary); cursor: pointer; font-size: 0.9375rem; transition: all 0.2s; }
        .oauth-btn:hover { background: var(--bg-hover); border-color: var(--accent-primary); }
        .oauth-btn svg { width: 20px; height: 20px; }
    </style>
</head>

<body>
    <div class="ambient-bg"></div>
    <nav class="nav">
        <div class="nav-inner"><a href="index.html" class="nav-logo">⚡ LetsVibeAI</a><button class="nav-toggle" aria-label="Toggle navigation">☰</button>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="module1.html">Modules</a></li>
                <li><a href="tools.html">Tools</a></li>
                <li><a href="news.html">News</a></li>
                <li><a href="lab1.html">Labs</a></li>
            </ul>
        </div>
    </nav>

    <main class="page-content">
        <div class="container">
            <div class="auth-container">
                <div class="auth-card" style="max-width:450px;">
                    <h2 id="auth-title">Welcome Back</h2>
                    <p class="auth-subtitle" id="auth-subtitle">Sign in to your account</p>

                    <div id="auth-message" class="form-error"></div>
                    <div id="auth-success" class="form-success"></div>

                    <!-- OAuth Buttons --n                    <div class="oauth-buttons">
                        <button class="oauth-btn" onclick="handleOAuth('github')">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                            Continue with GitHub
                        </button>
                        <button class="oauth-btn" onclick="handleOAuth('google')">
                            <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                            Continue with Google
                        </button>
                        <button class="oauth-btn" onclick="handleOAuth('azure')">
                            <svg viewBox="0 0 24 24" fill="#0078D4"><path d="M0 0h11.4v11.4H0zm12.6 0H24v11.4H12.6zm0 12.6H24V24H12.6zM0 12.6h11.4V24H0z"/></svg>
                            Continue with Microsoft
                        </button>
                    </div>
                    <div class="oauth-divider">or continue with email</div>

                    <!-- Auth Tabs -->
                    <div class="auth-tabs">
                        <button class="auth-tab active" data-tab="login" onclick="showTab('login')">Sign In</button>
                        <button class="auth-tab" data-tab="signup" onclick="showTab('signup')">Create Account</button>
                    </div>

                    <!-- Login Form -->
                    <form id="login-form" onsubmit="handleLogin(event)">
                        <div class="form-group">
                            <label for="login-email">Email</label>
                            <input type="email" id="login-email" class="form-input" required>
                        </div>
                        <div class="form-group">
                            <label for="login-password">Password</label>
                            <input type="password" id="login-password" class="form-input" required>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Sign In →</button>
                    </form>

                    <!-- Signup Form -->
                    <form id="signup-form" style="display:none;" onsubmit="handleSignup(event)">
                        <div class="form-group">
                            <label for="signup-name">Full Name</label>
                            <input type="text" id="signup-name" class="form-input" required>
                        </div>
                        <div class="form-group">
                            <label for="signup-email">Email</label>
                            <input type="email" id="signup-email" class="form-input" required>
                        </div>
                        <div class="form-group">
                            <label for="signup-password">Password</label>
                            <input type="password" id="signup-password" class="form-input" minlength="6" required>
                            <small style="color:var(--text-muted);">At least 6 characters</small>
                        </div>
                        <div class="form-group">
                            <label for="signup-type">Account Type</label>
                            <select id="signup-type" class="form-input">
                                <option value="individual">Individual Learner</option>
                                <option value="school">School/University</option>
                                <option value="corporate">Corporate/Organization</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Create Account →</button>
                    </form>

                    <div class="auth-footer" style="margin-top:var(--space-xl);">
                        By signing in, you agree to learn awesome things ⚡
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>⚡ LetsVibeAI &copy; 2025</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="supabase-client.js"></script>
    <script>
        function showTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
            
            if (tab === 'login') {
                document.getElementById('login-form').style.display = 'block';
                document.getElementById('signup-form').style.display = 'none';
                document.getElementById('auth-title').textContent = 'Welcome Back';
                document.getElementById('auth-subtitle').textContent = 'Sign in to your account';
            } else {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('signup-form').style.display = 'block';
                document.getElementById('auth-title').textContent = 'Create Account';
                document.getElementById('auth-subtitle').textContent = 'Join the vibe coding community';
            }
            hideMessage();
        }

        function showError(msg) {
            const el = document.getElementById('auth-message');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('auth-success').style.display = 'none';
        }

        function showSuccess(msg) {
            const el = document.getElementById('auth-success');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('auth-message').style.display = 'none';
        }

        function hideMessage() {
            document.getElementById('auth-message').style.display = 'none';
            document.getElementById('auth-success').style.display = 'none';
        }

        async function handleLogin(e) {
            e.preventDefault();
            hideMessage();
            
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            
            const btn = e.target.querySelector('button');
            btn.textContent = 'Signing in...';
            btn.disabled = true;

            try {
                const { data, error } = await window.auth.signIn(email, password);
                
                if (error) {
                    showError(error.message || 'Invalid email or password');
                } else if (data.user) {
                    // Create profile if not exists
                    const profile = await window.db.getProfile(data.user.id);
                    if (!profile) {
                        await window.db.createProfile({
                            user_id: data.user.id,
                            email: data.user.email,
                            name: data.user.email.split('@')[0],
                            avatar: '🧑‍💻',
                            vibe_type: 'Explorer',
                            account_type: 'individual'
                        });
                    }
                    window.location.href = 'dashboard.html';
                }
            } catch (err) {
                showError('Something went wrong. Please try again.');
            }
            
            btn.textContent = 'Sign In →';
            btn.disabled = false;
        }

        async function handleSignup(e) {
            e.preventDefault();
            hideMessage();
            
            const name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const accountType = document.getElementById('signup-type').value;
            
            const btn = e.target.querySelector('button');
            btn.textContent = 'Creating account...';
            btn.disabled = true;

            try {
                const { data, error } = await window.auth.signUp(email, password);
                
                if (error) {
                    showError(error.message || 'Could not create account');
                } else if (data.user) {
                    // Create profile
                    await window.db.createProfile({
                        user_id: data.user.id,
                        email: email,
                        name: name,
                        avatar: '🧑‍💻',
                        vibe_type: 'Explorer',
                        account_type: accountType,
                        tools: []
                    });
                    
                    showSuccess('Account created! Taking you to your dashboard...');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                }
            } catch (err) {
                showError(err.message || 'Something went wrong. Please try again.');
                console.error('Signup error:', err);
            }

            btn.textContent = 'Create Account →';
            btn.disabled = false;
        }

        // OAuth handler
        async function handleOAuth(provider) {
            const { data, error } = await window.auth.signInWithOAuth(provider);
            if (error) {
                showError(error.message || `Could not sign in with ${provider}`);
            }
        }

        // Check if already signed in
        document.addEventListener('DOMContentLoaded', async () => {
            if (window.auth.isSignedIn()) {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>

</html>
