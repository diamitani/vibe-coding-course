<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketplace — LetsVibeAI</title>
  <meta name="description" content="Templates, prompts, and tools for AI development projects.">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>

<body>
  <div class="ambient-bg"></div>

  <!-- Navigation -->
  <nav class="nav" style="position: sticky; top: 0; z-index: 100;">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">
        <span style="background: var(--gradient-text); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700; font-size: 1.5rem;">LetsVibeAI</span>
      </a>
      <button class="nav-toggle" aria-label="Toggle navigation">☰</button>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="catalog.html">Catalog</a></li>
        <li><a href="marketplace.html" style="color: var(--text-primary);">Marketplace</a></li>
        <li><a href="resources.html">Resources</a></li>
        <li><a href="community.html">Community</a></li>
        <li><a href="auth.html" class="btn btn-primary" style="padding: 0.5rem 1rem; margin-left: 0.5rem;">Sign In</a></li>
      </ul>
    </div>
  </nav>

  <main>
    <!-- Page Header -->
    <section style="background: var(--bg-secondary); padding: 2rem 1rem; border-bottom: 1px solid var(--border-subtle);">
      <div class="container" style="max-width: 1200px; margin: 0 auto;">
        <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">Marketplace</h1>
        <p style="color: var(--text-secondary);">Templates, prompts, and tools to accelerate your AI development</p>
      </div>
    </section>

    <div class="container" style="max-width: 1200px; margin: 0 auto; padding: 2rem 1rem;">
      <!-- Category Tabs -->
      <div style="display: flex; gap: 0.5rem; margin-bottom: 2rem; flex-wrap: wrap;">
        <button class="btn btn-primary marketplace-tab" data-category="all" onclick="filterMarketplace('all')">All</button>
        <button class="btn btn-secondary marketplace-tab" data-category="templates" onclick="filterMarketplace('templates')">Templates</button>
        <button class="btn btn-secondary marketplace-tab" data-category="prompts" onclick="filterMarketplace('prompts')">Prompts</button>
        <button class="btn btn-secondary marketplace-tab" data-category="tools" onclick="filterMarketplace('tools')">Tools</button>
      </div>

      <!-- Products Grid -->
      <div id="marketplace-grid" class="marketplace-grid" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem;">
        <!-- Products loaded dynamically -->
      </div>
    </div>
  </main>

  <footer class="footer" style="background: var(--bg-secondary); padding: 3rem 1rem 2rem; margin-top: 4rem;">
    <div class="container" style="max-width: 1200px; margin: 0 auto;">
      <p style="text-align: center; color: var(--text-muted); font-size: 0.9rem;">© 2025 LetsVibeAI. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="supabase-client.js"></script>
  <script src="script.js"></script>
  <script>
    const productsData = [
      {
        id: 1,
        title: "SaaS Starter Template",
        category: "templates",
        price: 49.99,
        rating: 4.8,
        reviews: 234,
        tag: "Bestseller",
        gradient: "linear-gradient(135deg, #667eea 0%, #764ba2 100%)",
        description: "Complete Next.js SaaS boilerplate with auth, payments, and dashboard"
      },
      {
        id: 2,
        title: "Prompt Engineering Bundle",
        category: "prompts",
        price: 29.99,
        rating: 4.9,
        reviews: 567,
        tag: "Popular",
        gradient: "linear-gradient(135deg, #f093fb 0%, #f5576c 100%)",
        description: "500+ curated prompts for developers and content creators"
      },
      {
        id: 3,
        title: "v0.dev Prompts Pack",
        category: "prompts",
        price: 19.99,
        rating: 4.7,
        reviews: 123,
        tag: null,
        gradient: "linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)",
        description: "100+ optimized prompts for v0.dev UI generation"
      },
      {
        id: 4,
        title: "Mobile App UI Kit",
        category: "templates",
        price: 59.99,
        rating: 4.6,
        reviews: 89,
        tag: "New",
        gradient: "linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)",
        description: "100+ React Native screens for iOS & Android"
      },
      {
        id: 5,
        title: "E-Commerce Bundle",
        category: "templates",
        price: 79.99,
        rating: 4.8,
        reviews: 345,
        tag: null,
        gradient: "linear-gradient(135deg, #f59e0b 0%, #ef4444 100%)",
        description: "Full store with Stripe checkout and inventory"
      },
      {
        id: 6,
        title: "AI Tools Guide",
        category: "tools",
        price: 0,
        rating: 4.7,
        reviews: 456,
        tag: "Free",
        gradient: "linear-gradient(135deg, #10b981 0%, #06b6d4 100%)",
        description: "Curated guide to the best AI development tools"
      }
    ];

    function renderMarketplace(products) {
      const grid = document.getElementById('marketplace-grid');
      grid.innerHTML = products.map(product => `
        <div style="background: var(--bg-card); border-radius: var(--radius-lg); overflow: hidden; border: 1px solid var(--border-subtle); transition: transform 0.3s ease, box-shadow 0.3s ease;" onmouseover="this.style.transform='translateY(-4px)'; this.style.boxShadow='0 10px 30px rgba(0,0,0,0.3)';" onmouseout="this.style.transform=''; this.style.boxShadow='';">
          <div style="height: 120px; background: ${product.gradient}; display: flex; align-items: center; justify-content: center; position: relative;">
            <span style="font-size: 3rem;">${product.category === 'templates' ? '🎨' : product.category === 'prompts' ? '📝' : '⚡'}</span>
            ${product.tag ? `<span style="position: absolute; top: 1rem; right: 1rem; background: rgba(255,255,255,0.2); padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.7rem;">${product.tag}</span>` : ''}
          </div>
          <div style="padding: 1.25rem;">
            <h3 style="font-size: 1rem; font-weight: 600; color: var(--text-primary); margin-bottom: 0.5rem;">${product.title}</h3>
            <p style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.75rem; min-height: 2.5em;">${product.description}</p>
            <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem;">
              <span style="color: #fbbf24; font-size: 0.85rem;">★★★★★</span>
              <span style="color: var(--text-muted); font-size: 0.8rem;">${product.rating} (${product.reviews})</span>
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <span style="font-weight: 600; color: var(--accent-emerald);">${product.price === 0 ? 'Free' : '$' + product.price}</span>
              <button class="btn btn-primary" style="padding: 0.5rem 1rem; font-size: 0.85rem;">Add to Cart</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterMarketplace(category) {
      document.querySelectorAll('.marketplace-tab').forEach(tab => {
        tab.classList.remove('btn-primary');
        tab.classList.add('btn-secondary');
      });
      document.querySelector(`[data-category="${category}"]`).classList.remove('btn-secondary');
      document.querySelector(`[data-category="${category}"]`).classList.add('btn-primary');
      
      const filtered = category === 'all' 
        ? productsData 
        : productsData.filter(p => p.category === category);
      
      renderMarketplace(filtered);
    }

    // Initialize
    renderMarketplace(productsData);
  </script>
</body>
</html>
